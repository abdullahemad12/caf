syntax = "proto3";

package cli;

service CliService {
    rpc GetActivePackageVersion (GetActivePackageVersionRequest) returns (GetActivePackageVersionResponse);
    rpc InstallPackage (InstallPackageRequest) returns (InstallPackageResponse);
}

message GetActivePackageVersionRequest {
  string package_name = 1;
}

message GetActivePackageVersionResponse {
    string package_name = 1;
    string version = 2;
}

message InstallPackageRequest {
  string package_name = 1;
  string package_version = 2;
}

message InstallPackageResponse {
}
