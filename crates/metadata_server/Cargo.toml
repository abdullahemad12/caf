[package]
name = "metadata_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
observability = { path = "../observability" }
tracing = "0.1"
directories = "6.0"
reqwest = { version = "0.13", features = ["json", "query"] }
